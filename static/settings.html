<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 试衣间</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e9ece7'/%3E%3Cpath d='M9 25V13l7-6 7 6v12' fill='none' stroke='%232f6f8f' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<header>
  <h1>设置</h1>
  <p class="lede"><a href=".">← 回试衣间</a></p>
</header>

<main>
  <section class="setting">
    <h2>生成来源</h2>
    <div class="radios">
      <label><input type="radio" name="source" value="api"> token plan API<span class="sub">1K 一次 58 credit · 实测 46–107 秒</span></label>
      <label><input type="radio" name="source" value="comfyui"> 本机 ComfyUI<span class="sub">不花额度 · 实测 480p 26 秒、1K 95 秒、2K 9 分钟</span></label>
    </div>
  </section>

  <section class="setting">
    <h2>输出尺寸</h2>
    <div class="radios">
      <label><input type="radio" name="size" value="480p"> 480p · 480×640 那点像素<span class="sub">只走本机 ComfyUI · 实测约 26 秒</span></label>
      <label><input type="radio" name="size" value="1k"> 1K（默认）<span class="sub">API 一次 58 credit · 本地实测 95 秒</span></label>
      <label><input type="radio" name="size" value="2k"> 2K · 更大更清楚<span class="sub">API 一次 108 credit · 本地约 9 分钟</span></label>
    </div>
    <p class="hint">耗时几乎正比于这一档的总像素（同机本地实测：480p 26 秒、1K 95 秒、2K 9 分钟）。
      480p 只有本机 ComfyUI 有 —— 接口按面积分档，最低就是 1K：实测请求 0.31M 照样扣 58，而且它不出小图，
      回给你的是参考图尺寸那张。</p>
    <p class="hint">输入多大不影响耗时（1.77M 的输入也是 26 秒），所以只有选 2K 时浏览器才把照片压到长边 2048
      再上传，其余两档都是 1536：那一档要的是更大的输出，就得喂更大的原图。</p>
  </section>

  <section class="setting">
    <h2>ComfyUI 地址</h2>
    <input id="comfy-url" class="url" type="text" spellcheck="false" autocomplete="off" aria-label="ComfyUI 地址">
    <p class="hint">选了 API 时这一项用不上，但地址仍然要写对格式。</p>
    <button id="check">测一下能不能连上</button>
    <ul class="problems" id="problems" aria-live="polite" hidden></ul>
  </section>

  <div class="actions">
    <button id="save" class="primary">保存</button>
    <span class="save-state" id="save-state" role="status" aria-live="polite"></span>
  </div>
</main>

<script src="static/settings.js"></script>
</body>
</html>
