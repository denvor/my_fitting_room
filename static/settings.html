<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 试衣间</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e9ece7'/%3E%3Cpath d='M9 25V13l7-6 7 6v12' fill='none' stroke='%232f6f8f' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<header>
  <h1>设置</h1>
  <p class="lede"><a href=".">← 回试衣间</a></p>
</header>

<main>
  <section class="setting">
    <h2>生成来源</h2>
    <div class="radios">
      <label><input type="radio" name="source" value="api"> token plan API<span class="sub">一次 58 credit · 约 80–100 秒</span></label>
      <label><input type="radio" name="source" value="comfyui"> 本机 ComfyUI<span class="sub">不花额度 · 1K 20 秒到 145 秒，2K 约 9 分钟</span></label>
    </div>
  </section>

  <section class="setting">
    <h2>输出尺寸</h2>
    <div class="radios">
      <label><input type="radio" name="size" value="1k"> 1K · 省额度省时间<span class="sub">API 一次 58 credit · 约 80–100 秒（默认）</span></label>
      <label><input type="radio" name="size" value="2k"> 2K · 更大更清楚<span class="sub">API 一次 108 credit · 本地约 9 分钟</span></label>
    </div>
    <p class="hint">两条来源共用这一档，输出都会铺满所选档位的面积，参考图小也一样（放出来的不是新增的细节）。
      选 2K 时浏览器把照片压到长边 2048 再上传（1K 是 1536）：出图尺寸不变，但接口和 ComfyUI 看到的输入更清楚。</p>
  </section>

  <section class="setting">
    <h2>ComfyUI 地址</h2>
    <input id="comfy-url" class="url" type="text" spellcheck="false" autocomplete="off" aria-label="ComfyUI 地址">
    <p class="hint">选了 API 时这一项用不上，但地址仍然要写对格式。</p>
    <button id="check">测一下能不能连上</button>
    <ul class="problems" id="problems" aria-live="polite" hidden></ul>
  </section>

  <div class="actions">
    <button id="save" class="primary">保存</button>
    <span class="save-state" id="save-state" role="status" aria-live="polite"></span>
  </div>
</main>

<script src="static/settings.js"></script>
</body>
</html>
