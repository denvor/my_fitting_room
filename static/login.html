<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>试衣间 · 登录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23e9ece7'/%3E%3Cpath d='M9 25V13l7-6 7 6v12' fill='none' stroke='%232f6f8f' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/style.css">
</head>

<body>

<header>
  <h1>试衣间</h1>
  <p class="lede">输口令进来 —— 图库里是你的照片，生成还要花额度。</p>
</header>

<main>
  <form class="setting" id="form">
    <h2>口令</h2>
    <input id="pw" class="url" type="password" autocomplete="current-password" aria-label="口令">
    <p class="login-msg" id="msg" role="status" aria-live="polite"></p>
    <div class="actions">
      <button type="submit" id="go" class="primary">进入</button>
    </div>
  </form>
</main>

<script src="static/login.js"></script>
</body>
</html>
